name: check
on: [push, pull_request]
jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Все быстрые проверки (контент, контраст, индекс серий, sw.js)
        run: npm run check
  browser:
    runs-on: ubuntu-latest
    needs: static
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - name: Тест в браузере (все страницы, сценарии, прогресс)
        run: npm run smoke
      - name: Аудио и адаптивная раскладка
        run: npm run test:audio
      - name: Аудит доступности axe-core
        run: npm run axe
